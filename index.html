<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Belajar · Tata & Yere</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0e1a33;--mut:#66758f;--line:#e4e9f3;--ac:#3b6df0;--hero:#0b1e4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1c;--card:#0f1930;--ink:#e8eefc;--mut:#8b9abb;--line:#1d2a48;--hero:#0a1738;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070d1c;--card:#0f1930;--ink:#e8eefc;--mut:#8b9abb;--line:#1d2a48;--hero:#0a1738;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.c{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 2px rgba(14,26,51,.04),0 10px 30px -16px rgba(14,26,51,.18)}
.m{color:var(--mut)}.ac{color:var(--ac)}
.b{background:var(--ac);color:#fff;font-weight:700;border-radius:12px;padding:.55rem 1rem;font-size:.875rem;transition:.15s}.b:hover{filter:brightness(1.1);transform:translateY(-1px)}
.g{border:1px solid var(--line);border-radius:12px;padding:.5rem .9rem;font-size:.875rem;font-weight:600}.g:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.i{width:100%;margin-top:.25rem;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;color:var(--ink);font-size:.9rem}.i:focus{outline:2px solid var(--ac);outline-offset:0}
.t{font-size:.65rem;font-weight:800;letter-spacing:.04em;padding:.15rem .5rem;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.s{background:color-mix(in srgb,var(--ac) 8%,var(--card));border:1px solid var(--line);border-radius:14px;padding:.75rem}
.hero{background:radial-gradient(circle at 85% 0,color-mix(in srgb,var(--ac) 70%,#fff) 0,transparent 55%),linear-gradient(135deg,var(--hero),color-mix(in srgb,var(--ac) 80%,var(--hero)));color:#fff;border-radius:28px}
.nav{padding:.45rem .8rem;border-radius:12px;font-size:.82rem;font-weight:600;white-space:nowrap;color:var(--mut)}.nav.on{background:var(--ac);color:#fff}
.pill{padding:.35rem .9rem;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid var(--line);white-space:nowrap}.pill.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@keyframes fl{50%{transform:translateY(-8px)}}.fl{animation:fl 5s ease-in-out infinite}
dialog{background:var(--card);color:var(--ink);border-radius:22px;padding:0;width:92vw;max-width:28rem}dialog::backdrop{background:rgba(7,13,28,.6)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<section id="login" class="min-h-screen grid lg:grid-cols-2">
  <div class="hero hidden lg:flex items-center justify-center m-4 p-10 relative overflow-hidden">
    <div class="fl max-w-md">
      <svg viewBox="0 0 400 260" class="w-full" aria-hidden="true"><circle cx="320" cy="50" r="30" fill="#fde68a"/><rect x="40" y="200" width="320" height="12" rx="6" fill="#fff" opacity=".25"/><rect x="70" y="150" width="60" height="50" rx="5" fill="#fff"/><rect x="140" y="120" width="50" height="80" rx="5" fill="#dbeafe"/><rect x="200" y="96" width="130" height="90" rx="9" fill="#0b1e4a" stroke="#fff" stroke-opacity=".5"/><rect x="208" y="104" width="114" height="74" rx="5" fill="#60a5fa"/><path d="M216 168l24-26 18 14 26-32 28 44z" fill="#fff" opacity=".9"/></svg>
      <h2 class="text-3xl font-extrabold mt-6">Belajar lebih tenang, lebih terarah.</h2>
      <p class="mt-2 opacity-80">Jadwal, tugas, fokus, dan progres Tata & Yere dalam satu ruang.</p>
    </div>
  </div>
  <div class="flex items-center justify-center p-6"><div class="w-full max-w-sm">
    <h1 class="text-2xl font-extrabold">Selamat datang 👋</h1><p class="m text-sm mb-6">Masuk untuk membuka agenda belajarmu.</p>
    <div class="grid grid-cols-2 gap-3 mb-4" id="userPick"></div>
    <label class="text-sm font-semibold" for="pw">Kata sandi</label>
    <input id="pw" type="password" class="i" placeholder="••••••••">
    <p id="err" class="text-sm text-red-500 mt-2 h-5"></p>
    <button id="btnLogin" class="b w-full mt-2 py-3">Masuk</button>
  </div></div>
</section>

<section id="app" class="hidden">
  <header class="top"><div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center gap-3">
    <nav id="tabs" class="flex gap-1 flex-1 overflow-x-auto"></nav>
    <button data-a="tab" data-v="prof" id="av" class="w-9 h-9 rounded-full grid place-items-center text-lg border" style="border-color:var(--line)"></button>
    <button id="btnOut" class="g">Keluar</button>
  </div></header>
  <main id="main" class="max-w-6xl mx-auto px-4 py-6"></main>
</section>
<dialog id="dlg"><div id="dlgBody" class="p-6"></div></dialog>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 px-4 py-2 rounded-full text-sm font-semibold hidden" style="background:var(--ink);color:var(--bg)"></div>

<script>
const DAYS=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'],USERS=['TATA','YERE'],K='sinau_v2';
const AC=[['Royal','#3b6df0'],['Langit','#0ea5e9'],['Indigo','#6366f1'],['Teal','#0d9488'],['Navy','#1d4ed8']];
const EMO=['🦊','🐼','🐯','🦉','🐙','🦄','🚀','🌙','🎧','☕','🔥','🌿'];
const TABS=[['home','🏠','Beranda'],['sch','📅','Jadwal'],['crs','📚','Matkul'],['task','✅','Tugas'],['pomo','⏱️','Fokus'],['prog','📈','Progres'],['log','📝','Jurnal'],['prof','👤','Profil']];
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const tp=t=>({id:uid(),text:t,done:false,kind:'topik'});
const pf=(n,e)=>({name:n,bio:'',goal:'',emoji:e,ac:0,theme:'auto'});
const seed=()=>({pw:{},prof:{TATA:pf('TATA','🦊'),YERE:pf('YERE','🐼')},tasks:[],logs:[],
 progress:[['Algorithm and Programming',24],['Basic Statistics',24],['Creativity and Innovation',29],['Discrete Mathematics',26],['Indonesian',35],['Linear Algebra',16],['Program Design Methods',48]].map(([name,pct])=>({id:uid(),name,pct})),
 courses:[['Matematika Diskrit','DISMAT','YERE'],['Basic Statistics','BASTAT','YERE'],['Aljabar Linear','LINAL','YERE'],['Algorithm and Programming','ALGO','TATA'],['Program Design Methods','PDM','TATA']].map(([name,short,owner])=>({id:uid(),name,short,owner,notes:short==='ALGO'?[tp('Recursive'),tp('Sorting: Bubble Sort'),tp('Sorting: Merge Sort')]:[]})),
 sessions:[[0,'BASTAT','19:00','21:15','YERE',''],[3,'DISMAT','19:00','21:15','YERE',''],[4,'LINAL','19:00','21:15','YERE',''],[5,'ALGO + PDM','20:00','','TATA','Sampai selesai'],[6,'SL','','','Bersama','Sesi belajar mandiri']].map(([day,title,start,end,owner,info])=>({id:uid(),day,title,start,end,owner,info}))});
let S;try{S=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
if(!S){S=seed();try{const o=JSON.parse(localStorage.getItem('sinau_agenda_v1')||'null');if(o){S.pw=o.pw||{};S.courses=o.courses;S.sessions=o.sessions}}catch(e){}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let me=null,tab='home',filter='mine',picked='TATA';
const P=()=>S.prof[me||picked];
function theme(){const p=P(),r=document.documentElement;r.style.setProperty('--ac',AC[p.ac][1]);p.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',p.theme)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),1800)}

async function initPw(){let c=0;for(const [u,p] of [['TATA','tata123'],['YERE','yere123']])if(!S.pw[u]){S.pw[u]=await sha(p);c=1}if(c)save()}
function drawPick(){$('userPick').innerHTML=USERS.map(u=>`<button data-a="pick" data-v="${u}" class="c py-3 font-bold text-center ${picked===u?'ac':''}" style="${picked===u?'border:2px solid var(--ac)':''}">${esc(S.prof[u].emoji)} ${u}</button>`).join('');theme()}
async function doLogin(){await initPw();if(await sha($('pw').value)===S.pw[picked]){me=picked;filter='mine';$('login').classList.add('hidden');$('app').classList.remove('hidden');$('pw').value='';$('err').textContent='';theme();render()}else $('err').textContent='Kata sandi salah.'}
$('btnLogin').onclick=doLogin;$('pw').onkeydown=e=>{if(e.key==='Enter')doLogin()};
$('btnOut').onclick=()=>{me=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');drawPick()};

const vis=o=>filter==='all'||o.owner===filter||o.owner==='Bersama'||(filter==='mine'&&o.owner===me);
const today=()=>(new Date().getDay()+6)%7;
const tm=s=>s.start?s.start+(s.end?' – '+s.end:' – selesai'):'Fleksibel';
function nextS(l){const n=new Date();let b=null;l.forEach(s=>{for(let a=0;a<8;a++){const d=new Date(n);d.setDate(n.getDate()+a);if((d.getDay()+6)%7!==s.day)continue;const[h,m]=(s.start||'00:00').split(':').map(Number);d.setHours(h,m,0,0);if(d>=n){if(!b||d<b.d)b={s,d};break}}});return b}
const left=d=>{const m=Math.floor((d-new Date())/6e4),dd=Math.floor(m/1440),h=Math.floor(m%1440/60);return(dd?dd+' hari ':'')+(h?h+' jam ':'')+m%60+' menit lagi'};
const myLogs=()=>S.logs.filter(l=>l.owner===me);
function streak(){const ds=new Set(myLogs().map(l=>l.date));let n=0,d=new Date();if(!ds.has(iso(d)))d.setDate(d.getDate()-1);while(ds.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function week(){const o=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=iso(d);o.push({l:['Min','Sen','Sel','Rab','Kam','Jum','Sab'][d.getDay()],v:myLogs().filter(x=>x.date===k).reduce((a,x)=>a+x.min,0)})}return o}
const copts=sel=>`<option value="">— umum —</option>`+S.courses.map(c=>`<option ${c.short===sel?'selected':''}>${esc(c.short)}</option>`).join('');
const filt=()=>`<div class="flex gap-2 mb-5 overflow-x-auto">${[['mine','Punyaku'],['TATA','TATA'],['YERE','YERE'],['all','Semua']].map(([v,l])=>`<button data-a="flt" data-v="${v}" class="pill ${filter===v?'on':''}">${l}</button>`).join('')}</div>`;
const sc=(s,act)=>`<div class="s"><div class="flex justify-between gap-2"><p class="font-bold">${esc(s.title)}</p><span class="t">${esc(s.owner)}</span></div><p class="ac text-sm font-semibold">${tm(s)}</p>${s.info?`<p class="m text-xs mt-1">${esc(s.info)}</p>`:''}${act?`<div class="flex gap-3 mt-2 text-xs font-semibold"><button class="ac" data-a="editS" data-v="${s.id}">Ubah</button><button class="text-red-500" data-a="delS" data-v="${s.id}">Hapus</button></div>`:''}</div>`;
const head=(t,btn)=>`<div class="flex items-center justify-between mb-4"><h2 class="text-xl font-extrabold">${t}</h2>${btn||''}</div>`;

function home(){
  const p=P(),ss=S.sessions.filter(vis),cs=S.courses.filter(vis),nx=nextS(ss),td=ss.filter(s=>s.day===today()).sort((a,b)=>a.start.localeCompare(b.start));
  const tk=S.tasks.filter(t=>t.owner===me&&!t.done),open=cs.reduce((a,c)=>a+c.notes.filter(n=>!n.done&&n.kind!=='topik').length,0),mins=week().reduce((a,x)=>a+x.v,0);
  const h=new Date().getHours(),hi=h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';
  return filt()+`<div class="hero p-6 sm:p-9 relative overflow-hidden"><div class="flex items-center gap-4"><div class="w-16 h-16 rounded-2xl grid place-items-center text-4xl" style="background:rgba(255,255,255,.18)">${esc(p.emoji)}</div><div><p class="text-sm opacity-80">${hi}</p><h2 class="text-2xl sm:text-3xl font-extrabold">${esc(p.name)}</h2><p class="text-sm opacity-80">${esc(p.bio||'Yuk lanjut belajar hari ini.')}</p></div></div>
  ${p.goal?`<p class="mt-4 text-sm"><span class="opacity-70">Target:</span> <b>${esc(p.goal)}</b></p>`:''}
  ${nx?`<div class="mt-5 inline-block rounded-2xl px-4 py-3" style="background:rgba(255,255,255,.14)"><p class="text-xs opacity-75">Sesi berikutnya</p><p class="font-bold text-lg">${esc(nx.s.title)} · ${DAYS[nx.s.day]} ${esc(nx.s.start)}</p><p class="text-sm opacity-85">${left(nx.d)}</p></div>`:''}</div>
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5">${[['🔥',streak(),'Hari beruntun'],['⏳',mins,'Menit minggu ini'],['✅',tk.length,'Tugas aktif'],['❓',open,'Belum paham']].map(([i,v,l])=>`<div class="c p-4"><p class="text-xl">${i}</p><p class="text-2xl font-extrabold">${v}</p><p class="m text-xs">${l}</p></div>`).join('')}</div>
  <div class="grid lg:grid-cols-3 gap-5 mt-7"><div class="lg:col-span-2"><h3 class="font-extrabold mb-3">Hari ini · ${DAYS[today()]}</h3><div class="grid sm:grid-cols-2 gap-3">${td.length?td.map(s=>sc(s)).join(''):'<div class="c p-6 m sm:col-span-2">Tidak ada sesi hari ini. Pas untuk mengulang catatan.</div>'}</div></div>
  <div><h3 class="font-extrabold mb-3">Tugas terdekat</h3><div class="c p-4 space-y-2">${tk.slice(0,4).map(t=>`<p class="text-sm">• ${esc(t.text)} <span class="m">${t.due?'· '+t.due:''}</span></p>`).join('')||'<p class="m text-sm">Tidak ada tugas aktif 🎉</p>'}</div></div></div>`}

const schedule=()=>filt()+head('Jadwal Mingguan','<button class="b" data-a="addS">+ Tambah sesi</button>')+`<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${DAYS.map((d,i)=>{const l=S.sessions.filter(s=>s.day===i&&vis(s)).sort((a,b)=>a.start.localeCompare(b.start));return`<div class="c p-4" style="${i===today()?'outline:2px solid var(--ac)':''}"><div class="flex justify-between mb-3"><p class="font-extrabold">${d}</p>${i===today()?'<span class="t">HARI INI</span>':''}</div><div class="space-y-2">${l.map(s=>sc(s,1)).join('')||'<p class="m text-sm">Kosong</p>'}</div></div>`}).join('')}</div>`;

const courses=()=>filt()+head('Matkul & Catatan','<button class="b" data-a="addC">+ Tambah matkul</button>')+`<div class="grid md:grid-cols-2 gap-4">${S.courses.filter(vis).map(c=>`<div class="c p-5"><div class="flex justify-between gap-2"><div><p class="font-extrabold text-lg">${esc(c.name)}</p><p class="m text-xs">${esc(c.short)} · ${c.notes.filter(n=>!n.done).length} catatan terbuka</p></div><span class="t h-fit">${esc(c.owner)}</span></div><ul class="mt-3 space-y-1.5">${c.notes.map(n=>`<li class="flex items-start gap-2 text-sm"><input type="checkbox" class="mt-1" style="accent-color:var(--ac)" data-c="chkN" data-v="${c.id}|${n.id}" ${n.done?'checked':''}><span class="flex-1 ${n.done?'line-through m':''}">${n.kind==='topik'?'<span class="t mr-1">TOPIK</span>':''}${esc(n.text)}</span><button class="m" data-a="rmN" data-v="${c.id}|${n.id}" aria-label="Hapus">✕</button></li>`).join('')||'<li class="m text-sm">Belum ada catatan.</li>'}</ul><div class="flex gap-2 mt-3"><input class="i !mt-0" id="n_${c.id}" placeholder="Apa yang belum dipahami?"><button class="b" data-a="addN" data-v="${c.id}">Simpan</button></div><button class="mt-3 text-xs text-red-500 font-semibold" data-a="delC" data-v="${c.id}">Hapus matkul</button></div>`).join('')}</div>`;

function tasks(){const l=S.tasks.filter(t=>t.owner===me).sort((a,b)=>a.done-b.done||(a.due||'9').localeCompare(b.due||'9')),n=iso(new Date());
  return head('Tugas & Deadline')+`<div class="c p-4 grid sm:grid-cols-5 gap-2 mb-4"><input id="t_x" class="i sm:col-span-2" placeholder="Tugas baru…"><select id="t_c" class="i">${copts()}</select><input id="t_d" type="date" class="i"><button class="b" data-a="addT">Tambah</button></div><div class="space-y-2">${l.map(t=>`<div class="c p-3 flex items-center gap-3"><input type="checkbox" style="accent-color:var(--ac)" data-c="togT" data-v="${t.id}" ${t.done?'checked':''}><div class="flex-1 min-w-0"><p class="${t.done?'line-through m':'font-semibold'}">${esc(t.text)}</p><p class="text-xs m">${t.course?esc(t.course):''} ${t.due?'· tenggat '+t.due:''}</p></div>${!t.done&&t.due&&t.due<n?'<span class="t" style="background:#fee2e2;color:#b91c1c">TERLAMBAT</span>':''}<button class="m" data-a="delT" data-v="${t.id}" aria-label="Hapus">✕</button></div>`).join('')||'<div class="c p-6 m">Belum ada tugas.</div>'}</div>`}

const PM={mode:25,left:1500,run:false,h:null};
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function pDraw(){const a=$('pt'),r=$('pr');if(a)a.textContent=mmss(PM.left);if(r)r.style.strokeDashoffset=565*(1-PM.left/(PM.mode*60))}
function pTick(){PM.left--;if(PM.left<=0){clearInterval(PM.h);PM.run=false;PM.left=PM.mode*60;if(PM.mode>=25&&me){S.logs.push({id:uid(),owner:me,date:iso(new Date()),course:$('p_c')?.value||'',min:PM.mode,text:'Sesi fokus (Pomodoro)',mood:'🙂'});save()}toast('Sesi selesai! 🎉');render();return}pDraw()}
function pomo(){const n=myLogs().filter(l=>l.date===iso(new Date())).reduce((a,l)=>a+l.min,0);
  return head('Mode Fokus')+`<div class="c p-8 text-center max-w-md mx-auto"><div class="flex justify-center gap-2 mb-4">${[[25,'Fokus 25'],[50,'Fokus 50'],[5,'Istirahat 5']].map(([m,l])=>`<button class="pill ${PM.mode===m?'on':''}" data-a="pMode" data-v="${m}">${l}</button>`).join('')}</div>
  <div class="relative w-56 h-56 mx-auto"><svg viewBox="0 0 200 200" class="w-full -rotate-90"><circle cx="100" cy="100" r="90" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="pr" cx="100" cy="100" r="90" fill="none" stroke="var(--ac)" stroke-width="10" stroke-linecap="round" stroke-dasharray="565" style="stroke-dashoffset:${565*(1-PM.left/(PM.mode*60))}px;transition:.5s"/></svg><p id="pt" class="absolute inset-0 grid place-items-center text-5xl font-extrabold">${mmss(PM.left)}</p></div>
  <label class="block text-left text-sm font-semibold mt-5">Matkul yang dipelajari<select id="p_c" class="i">${copts()}</select></label>
  <div class="flex gap-2 justify-center mt-4"><button class="b" data-a="pGo">${PM.run?'Jeda':'Mulai'}</button><button class="g" data-a="pReset">Reset</button></div><p class="m text-sm mt-4">Fokus hari ini: <b class="ac">${n} menit</b></p></div>`}

function prog(){const l=S.progress,avg=Math.round(l.reduce((a,x)=>a+x.pct,0)/(l.length||1)),w=week(),mx=Math.max(1,...w.map(x=>x.v));
  return head('Progres Belajar')+`<div class="grid lg:grid-cols-5 gap-5"><div class="c p-5 lg:col-span-3"><div class="flex justify-between mb-3"><p class="font-extrabold">Progres kelas</p><span class="t">Rata-rata ${avg}%</span></div><div class="space-y-4">${l.map(x=>`<div><div class="flex justify-between text-sm"><span>${esc(x.name)}</span><b class="ac">${x.pct}%</b></div><input type="range" min="0" max="100" value="${x.pct}" data-c="setP" data-v="${x.id}" class="w-full" style="accent-color:var(--ac)"></div>`).join('')}</div><div class="flex gap-2 mt-4"><input id="pg_n" class="i !mt-0" placeholder="Tambah matkul…"><button class="b" data-a="addP">Tambah</button></div></div>
  <div class="c p-5 lg:col-span-2"><p class="font-extrabold">Menit belajar 7 hari</p><div class="flex items-end gap-2 h-44 mt-4">${w.map(x=>`<div class="flex-1 text-center"><div class="rounded-lg mx-auto" style="height:${Math.max(4,x.v/mx*130)}px;background:var(--ac);opacity:${x.v?1:.2}"></div><p class="text-[10px] m mt-1">${x.l}</p><p class="text-[10px] font-bold">${x.v}</p></div>`).join('')}</div></div></div>`}

const log=()=>head('Jurnal Belajar')+`<div class="c p-4 grid sm:grid-cols-6 gap-2 mb-4"><select id="l_c" class="i">${copts()}</select><input id="l_m" type="number" min="1" class="i" placeholder="Menit"><select id="l_e" class="i">${['🙂','😀','😐','😵'].map(e=>`<option>${e}</option>`).join('')}</select><input id="l_x" class="i sm:col-span-2" placeholder="Apa yang dipelajari?"><button class="b" data-a="addL">Catat</button></div><div class="space-y-2">${myLogs().slice().reverse().map(l=>`<div class="c p-3 flex items-center gap-3"><span class="text-xl">${l.mood}</span><div class="flex-1"><p class="font-semibold text-sm">${esc(l.text||'Belajar')}</p><p class="m text-xs">${l.date} · ${l.min} menit ${l.course?'· '+esc(l.course):''}</p></div><button class="m" data-a="delL" data-v="${l.id}" aria-label="Hapus">✕</button></div>`).join('')||'<div class="c p-6 m">Belum ada catatan belajar.</div>'}</div>`;

function prof(){const p=P();
  return head('Profil Saya')+`<div class="grid lg:grid-cols-5 gap-5"><div class="c p-6 lg:col-span-3 space-y-4"><div class="flex items-center gap-4"><div class="w-20 h-20 rounded-3xl grid place-items-center text-5xl" style="background:color-mix(in srgb,var(--ac) 14%,transparent)">${esc(p.emoji)}</div><div><p class="text-xl font-extrabold">${esc(p.name)}</p><p class="m text-sm">Akun ${me}</p></div></div>
  <label class="block text-sm font-semibold">Nama tampilan<input id="pf_n" class="i" value="${esc(p.name)}"></label><label class="block text-sm font-semibold">Bio<input id="pf_b" class="i" value="${esc(p.bio)}" placeholder="Tulis sesuatu tentang dirimu"></label><label class="block text-sm font-semibold">Target semester<input id="pf_g" class="i" value="${esc(p.goal)}" placeholder="mis. IP 3,8"></label><button class="b" data-a="saveP">Simpan profil</button></div>
  <div class="lg:col-span-2 space-y-5"><div class="c p-5"><p class="font-bold mb-2">Avatar</p><div class="grid grid-cols-6 gap-2">${EMO.map(e=>`<button data-a="emo" data-v="${e}" class="text-2xl p-1.5 rounded-xl ${p.emoji===e?'t':''}">${e}</button>`).join('')}</div><p class="font-bold mt-4 mb-2">Warna aksen</p><div class="flex gap-2">${AC.map((a,i)=>`<button data-a="acc" data-v="${i}" aria-label="${a[0]}" class="w-9 h-9 rounded-full" style="background:${a[1]};${p.ac===i?'outline:3px solid var(--ink);outline-offset:2px':''}"></button>`).join('')}</div><p class="font-bold mt-4 mb-2">Tema</p><div class="flex gap-2">${[['auto','Otomatis'],['light','Terang'],['dark','Gelap']].map(([v,l])=>`<button data-a="thm" data-v="${v}" class="pill ${p.theme===v?'on':''}">${l}</button>`).join('')}</div></div>
  <div class="c p-5"><p class="font-bold mb-2">Ganti kata sandi</p><input id="pw_o" type="password" class="i" placeholder="Sandi lama"><input id="pw_n" type="password" class="i" placeholder="Sandi baru (min. 6)"><p id="pw_e" class="text-sm text-red-500 h-5"></p><button class="g" data-a="chPw">Ubah sandi</button></div></div></div>`}

function render(){
  $('tabs').innerHTML=TABS.map(([k,i,l])=>`<button data-a="tab" data-v="${k}" class="nav ${tab===k?'on':''}">${i} ${l}</button>`).join('');
  $('av').textContent=P().emoji;
  $('main').innerHTML=({home,sch:schedule,crs:courses,task:tasks,pomo,prog,log,prof})[tab]();
}
const dlg=h=>{$('dlgBody').innerHTML=h;$('dlg').showModal()};
const own=s=>['TATA','YERE','Bersama'].map(o=>`<option ${o===s?'selected':''}>${o}</option>`).join('');
function sForm(id){const s=id?S.sessions.find(x=>x.id===id):{day:today(),title:'',start:'19:00',end:'',owner:me,info:''};
  dlg(`<h3 class="font-extrabold text-lg mb-3">${id?'Ubah':'Tambah'} sesi</h3><div class="space-y-3 text-sm font-semibold"><label class="block">Judul<input id="f_t" class="i" value="${esc(s.title)}"></label><label class="block">Hari<select id="f_d" class="i">${DAYS.map((d,i)=>`<option value="${i}" ${i===s.day?'selected':''}>${d}</option>`).join('')}</select></label><div class="grid grid-cols-2 gap-3"><label>Mulai<input id="f_s" type="time" class="i" value="${s.start}"></label><label>Selesai<input id="f_e" type="time" class="i" value="${s.end}"></label></div><label class="block">Untuk<select id="f_o" class="i">${own(s.owner)}</select></label><label class="block">Keterangan<input id="f_i" class="i" value="${esc(s.info)}"></label></div><div class="flex justify-end gap-2 mt-5"><button class="g" data-a="close">Batal</button><button class="b" data-a="okS" data-v="${id||''}">Simpan</button></div>`)}
const cForm=()=>dlg(`<h3 class="font-extrabold text-lg mb-3">Tambah matkul</h3><div class="space-y-3 text-sm font-semibold"><label class="block">Nama<input id="c_n" class="i"></label><label class="block">Singkatan<input id="c_s" class="i"></label><label class="block">Untuk<select id="c_o" class="i">${own(me)}</select></label></div><div class="flex justify-end gap-2 mt-5"><button class="g" data-a="close">Batal</button><button class="b" data-a="okC">Simpan</button></div>`);
const val=id=>$(id).value.trim(),pr=v=>v.split('|');
const A={
 pick(v){picked=v;drawPick()},close(){$('dlg').close()},
 tab(v){tab=v;render()},flt(v){filter=v;render()},
 addS(){sForm()},editS(v){sForm(v)},delS(v){if(confirm('Hapus sesi ini?')){S.sessions=S.sessions.filter(s=>s.id!==v);save();render()}},
 okS(v){const t=val('f_t');if(!t)return;const o={title:t,day:+$('f_d').value,start:$('f_s').value,end:$('f_e').value,owner:$('f_o').value,info:val('f_i')};if(v)Object.assign(S.sessions.find(x=>x.id===v),o);else S.sessions.push({id:uid(),...o});save();$('dlg').close();render()},
 addC(){cForm()},okC(){const n=val('c_n');if(!n)return;S.courses.push({id:uid(),name:n,short:val('c_s')||n.slice(0,6).toUpperCase(),owner:$('c_o').value,notes:[]});save();$('dlg').close();render()},
 delC(v){if(confirm('Hapus matkul beserta catatannya?')){S.courses=S.courses.filter(c=>c.id!==v);save();render()}},
 addN(v){const t=val('n_'+v);if(!t)return;S.courses.find(c=>c.id===v).notes.push({id:uid(),text:t,done:false,kind:'catatan'});save();render()},
 rmN(v){const[c,n]=pr(v),o=S.courses.find(x=>x.id===c);o.notes=o.notes.filter(x=>x.id!==n);save();render()},
 addT(){const t=val('t_x');if(!t)return;S.tasks.push({id:uid(),owner:me,text:t,course:$('t_c').value,due:$('t_d').value,done:false});save();render()},
 delT(v){S.tasks=S.tasks.filter(t=>t.id!==v);save();render()},
 pMode(v){clearInterval(PM.h);PM.run=false;PM.mode=+v;PM.left=PM.mode*60;render()},
 pGo(){if(PM.run){clearInterval(PM.h);PM.run=false}else{PM.run=true;PM.h=setInterval(pTick,1000)}render()},
 pReset(){clearInterval(PM.h);PM.run=false;PM.left=PM.mode*60;render()},
 addP(){const n=val('pg_n');if(!n)return;S.progress.push({id:uid(),name:n,pct:0});save();render()},
 addL(){const m=+val('l_m');if(!m)return;S.logs.push({id:uid(),owner:me,date:iso(new Date()),course:$('l_c').value,min:m,text:val('l_x'),mood:$('l_e').value});save();render()},
 delL(v){S.logs=S.logs.filter(l=>l.id!==v);save();render()},
 saveP(){const p=P();p.name=val('pf_n')||me;p.bio=val('pf_b');p.goal=val('pf_g');save();render();toast('Profil tersimpan')},
 emo(v){P().emoji=v;save();render()},acc(v){P().ac=+v;save();theme();render()},thm(v){P().theme=v;save();theme();render()},
 async chPw(){if(await sha($('pw_o').value)!==S.pw[me]){$('pw_e').textContent='Sandi lama salah.';return}const n=$('pw_n').value;if(n.length<6){$('pw_e').textContent='Minimal 6 karakter.';return}S.pw[me]=await sha(n);save();render();toast('Sandi diubah')}
};
const C={chkN(v,el){const[c,n]=pr(v);S.courses.find(x=>x.id===c).notes.find(x=>x.id===n).done=el.checked;save();render()},
 togT(v,el){S.tasks.find(t=>t.id===v).done=el.checked;save();render()},
 setP(v,el){S.progress.find(x=>x.id===v).pct=+el.value;save();clearTimeout(C.h);C.h=setTimeout(render,400)}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset.v,el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el)C[el.dataset.c](el.dataset.v,el)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id?.startsWith('n_'))A.addN(e.target.id.slice(2))});
drawPick();initPw();
</script>
</body>
</html>
