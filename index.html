<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Belajar</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0e1a33;--mut:#66758f;--line:#e4e9f3;--ac:#3b6df0;--hero:#0b1e4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1c;--card:#0f1930;--ink:#e8eefc;--mut:#8b9abb;--line:#1d2a48;--hero:#0a1738;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070d1c;--card:#0f1930;--ink:#e8eefc;--mut:#8b9abb;--line:#1d2a48;--hero:#0a1738;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.c{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 2px rgba(14,26,51,.04),0 10px 30px -16px rgba(14,26,51,.18)}
.m{color:var(--mut)}.ac{color:var(--ac)}
.b{background:var(--ac);color:#fff;font-weight:700;border-radius:12px;padding:.55rem 1rem;font-size:.875rem;transition:.15s}.b:hover{filter:brightness(1.1);transform:translateY(-1px)}
.g{border:1px solid var(--line);border-radius:12px;padding:.5rem .9rem;font-size:.875rem;font-weight:600}.g:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.i{width:100%;margin-top:.25rem;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;color:var(--ink);font-size:.9rem}.i:focus{outline:2px solid var(--ac);outline-offset:0}
.t{font-size:.65rem;font-weight:800;letter-spacing:.04em;padding:.15rem .5rem;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.s{background:color-mix(in srgb,var(--ac) 8%,var(--card));border:1px solid var(--line);border-radius:14px;padding:.75rem}
.hero{background:radial-gradient(circle at 85% 0,color-mix(in srgb,var(--ac) 70%,#fff) 0,transparent 55%),linear-gradient(135deg,var(--hero),color-mix(in srgb,var(--ac) 80%,var(--hero)));color:#fff;border-radius:28px}
.nav{padding:.45rem .8rem;border-radius:12px;font-size:.82rem;font-weight:600;white-space:nowrap;color:var(--mut)}.nav.on{background:var(--ac);color:#fff}
.pill{padding:.35rem .9rem;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid var(--line);white-space:nowrap}.pill.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@keyframes fl{50%{transform:translateY(-8px)}}.fl{animation:fl 5s ease-in-out infinite}
dialog{background:var(--card);color:var(--ink);border-radius:22px;padding:0;width:92vw;max-width:28rem}dialog::backdrop{background:rgba(7,13,28,.6)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;animation:fl 9s ease-in-out infinite}
.b1{width:22rem;height:22rem;background:var(--ac);top:-6rem;left:-6rem}.b2{width:18rem;height:18rem;background:#38bdf8;bottom:-5rem;right:-4rem;animation-delay:2s}.b3{width:12rem;height:12rem;background:#a78bfa;top:40%;left:60%;animation-delay:4s}
.fs{position:absolute;font-size:2rem;animation:fl 6s ease-in-out infinite;user-select:none}
.hand{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}#mas.cover #hL{transform:translate(14px,-70px)}#mas.cover #hR{transform:translate(-14px,-70px)}
#eL,#eR{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes jp{40%{transform:translateY(-22px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}.jmp{animation:jp .6s}
@keyframes sk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}.shk{animation:sk .45s}
.si{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem;border-radius:12px;font-size:.88rem;font-weight:600;color:var(--mut);width:100%;text-align:left;transition:.15s}.si:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}.si.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.sg{font-size:.65rem;letter-spacing:.1em;font-weight:800;color:var(--mut);margin:.9rem .8rem .3rem}
.bi{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem 0;font-size:.68rem;font-weight:600;color:var(--mut)}.bi.on{color:var(--ac)}
.lg-ml,.lg-pl{}
@media(min-width:1024px){.lg-ml{margin-left:15rem}.lg-pl{padding-left:15rem}body.side-off .lg-ml{margin-left:0}body.side-off .lg-pl{padding-left:0}body.side-off #side{display:none!important}}
#login{background:radial-gradient(120% 90% at 20% 0%,#16296b 0%,#0a1233 55%,#050a1f 100%);color:#e9efff;color-scheme:dark}
#login .aur i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:fl 10s ease-in-out infinite}
.a1{width:26rem;height:26rem;background:#2563eb;top:-8rem;left:-6rem}.a2{width:22rem;height:22rem;background:#06b6d4;bottom:-8rem;right:-5rem;animation-delay:2s}.a3{width:16rem;height:16rem;background:#8b5cf6;top:35%;left:62%;animation-delay:4s}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0,transparent 70%);mask-image:radial-gradient(circle at 50% 40%,#000 0,transparent 70%)}
.gl{position:relative;width:100%;max-width:24rem;padding:1.75rem;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(20px);box-shadow:0 30px 80px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25);text-align:center}
.gl h1{font-size:1.5rem;font-weight:800;margin-top:.25rem;color:#fff}
.gl label{display:block;text-align:left;font-size:.8rem;font-weight:700;margin-top:.9rem;color:#c8d6ff}
.gi{display:flex;align-items:center;gap:.5rem;margin-top:.3rem;padding:.1rem .8rem;border-radius:14px;background:rgba(5,10,31,.55);border:1px solid rgba(255,255,255,.14);transition:.2s}.gi:focus-within{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.25)}
.gi input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:.75rem 0;color:#fff}.gi input::placeholder{color:#7c8cc0}.gi button{font-size:1rem}
.gb{width:100%;margin-top:1rem;padding:.85rem;border-radius:14px;font-weight:800;color:#fff;background:linear-gradient(90deg,#2563eb,#06b6d4);position:relative;overflow:hidden;transition:.2s}.gb:hover{transform:translateY(-2px);box-shadow:0 12px 30px -8px #2563eb}.gb::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:.6s}.gb:hover::after{transform:translateX(120%)}
.px{position:absolute;transition:transform .25s ease-out;pointer-events:none}.fs{position:static;display:block;font-size:2rem;font-style:normal;animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
#login #bub{min-height:1.25rem;font-size:.85rem;color:#a9bcf5;margin-top:.25rem}
#login #err{min-height:1.25rem;font-size:.8rem;color:#fda4af;text-align:left;margin-top:.5rem}
.nod{animation:nd .35s}@keyframes nd{50%{transform:translateY(5px)}}
</style>
</head>
<body>
<section id="login" class="min-h-screen relative overflow-hidden grid place-items-center p-6">
  <div class="aur"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div><div class="grid-bg"></div>
  <span class="px" data-d="26" style="left:7%;top:14%"><i class="fs">📚</i></span><span class="px" data-d="34" style="right:9%;top:18%"><i class="fs" style="animation-delay:1s">✏️</i></span><span class="px" data-d="20" style="left:12%;bottom:16%"><i class="fs" style="animation-delay:2s">⭐</i></span><span class="px" data-d="30" style="right:13%;bottom:14%"><i class="fs" style="animation-delay:3s">☕</i></span><span class="px" data-d="16" style="left:44%;top:6%"><i class="fs" style="animation-delay:1.5s">💡</i></span>
  <div id="lc" class="gl">
    <svg id="mas" viewBox="0 0 160 150" class="w-40 mx-auto cursor-pointer" data-a="mas" role="img" aria-label="Maskot belajar">
      <circle cx="80" cy="82" r="58" fill="var(--ac)"/><ellipse cx="80" cy="90" rx="44" ry="38" fill="#fff" opacity=".95"/>
      <path d="M40 40l40-22 40 22-40 20z" fill="#0e1a33"/><path d="M118 42v22" stroke="#fbbf24" stroke-width="3"/><circle cx="118" cy="68" r="4" fill="#fbbf24"/>
      <g id="eL"><circle cx="62" cy="86" r="12" fill="#fff" stroke="#cbd5e1"/><circle id="pL" cx="62" cy="86" r="6" fill="#0e1a33"/></g>
      <g id="eR"><circle cx="98" cy="86" r="12" fill="#fff" stroke="#cbd5e1"/><circle id="pR" cx="98" cy="86" r="6" fill="#0e1a33"/></g>
      <circle cx="48" cy="104" r="6" fill="#fda4af" opacity=".75"/><circle cx="112" cy="104" r="6" fill="#fda4af" opacity=".75"/>
      <path d="M68 104q12 12 24 0" stroke="#0e1a33" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse id="hL" class="hand" cx="40" cy="146" rx="14" ry="11" fill="#fde68a"/><ellipse id="hR" class="hand" cx="120" cy="146" rx="14" ry="11" fill="#fde68a"/>
    </svg>
    <h1>Agenda Belajar</h1>
    <p id="bub"></p>
    <label>Nama pengguna<div class="gi"><span>👤</span><input id="un" autocomplete="username" placeholder="ketik namamu"></div></label>
    <label>Kata sandi<div class="gi"><span>🔑</span><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"><button type="button" data-a="pwEye" aria-label="Tampilkan sandi">👁️</button></div></label>
    <p id="err"></p>
    <button id="btnLogin" class="gb">Masuk 🚀</button>
    <p class="mt-4 text-xs" style="color:#8ea2e0">Konsisten sedikit demi sedikit, hasilnya besar ✨</p>
  </div>
</section>

<section id="app" class="hidden">
  <header class="top lg-pl"><div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center gap-3">
    <button data-a="side" class="g hidden lg:inline-flex" aria-label="Buka atau tutup menu samping">☰</button><span class="lg:hidden w-9 h-9 rounded-xl grid place-items-center text-white font-black" style="background:var(--ac)">S</span><div class="flex-1 min-w-0"><p id="ttl" class="font-extrabold text-lg truncate"></p></div>
    <button data-a="search" class="g" aria-label="Cari">🔍</button><button data-a="notif" id="bell" class="g" aria-label="Pengingat">🔕</button><button data-a="tab" data-v="prof" id="av" class="w-9 h-9 rounded-full grid place-items-center text-lg border" style="border-color:var(--line)"></button>
    <button id="btnOut" class="g">Keluar</button>
  </div></header>
  <aside id="side" class="hidden lg:flex fixed left-0 top-0 bottom-0 w-60 flex-col p-4 z-30" style="background:var(--card);border-right:1px solid var(--line)"></aside><nav id="bn" class="lg:hidden fixed bottom-0 inset-x-0 z-30 grid grid-cols-5" style="background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)"></nav><div class="lg-ml"><main id="main" class="max-w-6xl mx-auto px-4 py-6 pb-28 lg:pb-8"></main></div>
</section>
<dialog id="dlg"><div id="dlgBody" class="p-6"></div></dialog>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 px-4 py-2 rounded-full text-sm font-semibold hidden" style="background:var(--ink);color:var(--bg)"></div>

<script>
const DAYS=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'],USERS=['TATA','YERE'],K='sinau_v2';
const AC=[['Royal','#3b6df0'],['Langit','#0ea5e9'],['Indigo','#6366f1'],['Teal','#0d9488'],['Navy','#1d4ed8']];
const EMO=['🦊','🐼','🐯','🦉','🐙','🦄','🚀','🌙','🎧','☕','🔥','🌿'];
const TABS=[['home','🏠','Beranda'],['sch','📅','Jadwal'],['crs','📚','Matkul'],['task','✅','Tugas'],['pomo','⏱️','Fokus'],['prog','📈','Progres'],['log','📝','Jurnal'],['cal','🗓️','Kalender'],['exam','🎯','Ujian'],['card','🃏','Kartu'],['err','🧩','Soal Salah'],['tutor','🎓','Tutor'],['lib','🔗','Materi'],['note','📌','Catatan'],['ipk','🧮','IPK'],['xp','🏆','Prestasi'],['next','🔔','Agenda'],['att','📸','Absen'],['fin','💰','Keuangan'],['prof','👤','Profil']];
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const tp=t=>({id:uid(),text:t,done:false,kind:'topik'});
const pf=(n,e)=>({name:n,bio:'',goal:'',emoji:e,ac:0,theme:'auto'});
const seed=()=>({pw:{},prof:{TATA:pf('TATA','🦊'),YERE:pf('YERE','🐼')},tasks:[],logs:[],
 progress:[['Algorithm and Programming',24],['Basic Statistics',24],['Creativity and Innovation',29],['Discrete Mathematics',26],['Indonesian',35],['Linear Algebra',16],['Program Design Methods',48]].map(([name,pct])=>({id:uid(),name,pct})),
 courses:[['Matematika Diskrit','DISMAT','YERE'],['Basic Statistics','BASTAT','YERE'],['Aljabar Linear','LINAL','YERE'],['Algorithm and Programming','ALGO','TATA'],['Program Design Methods','PDM','TATA']].map(([name,short,owner])=>({id:uid(),name,short,owner,notes:short==='ALGO'?[tp('Recursive'),tp('Sorting: Bubble Sort'),tp('Sorting: Merge Sort')]:[]})),
 sessions:[[0,'BASTAT','19:00','21:15','YERE',''],[3,'DISMAT','19:00','21:15','YERE',''],[4,'LINAL','19:00','21:15','YERE',''],[5,'ALGO + PDM','20:00','','TATA','Sampai selesai'],[6,'SL','','','Bersama','Sesi belajar mandiri']].map(([day,title,start,end,owner,info])=>({id:uid(),day,title,start,end,owner,info}))});
let S;try{S=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
if(!S){S=seed();try{const o=JSON.parse(localStorage.getItem('sinau_agenda_v1')||'null');if(o){S.pw=o.pw||{};S.courses=o.courses;S.sessions=o.sessions}}catch(e){}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let me=null,tab='home',filter='mine',picked='TATA';
['exams','cards','errs','meets','lib','notes','rem','att','fin'].forEach(k=>{S[k]=S[k]||[]});
if(!S.ipk||!S.ipk.r1){S.ipk={sc:{},r1:1};save()}
const P=()=>S.prof[me||picked];
function theme(){const p=P(),r=document.documentElement;r.style.setProperty('--ac',AC[p.ac][1]);p.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',p.theme)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),1800)}

async function initPw(){let c=0;for(const [u,p] of [['TATA','tata123'],['YERE','yere123']])if(!S.pw[u]){S.pw[u]=await sha(p);c=1}if(c)save()}
function drawPick(){theme()}
async function doLogin(){await initPw();const u=$('un').value.trim().toUpperCase();if(USERS.includes(u)&&await sha($('pw').value)===S.pw[u]){me=u;picked=u;filter='mine';$('un').value='';boom();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('pw').value='';$('err').textContent='';theme();render()}else{$('err').textContent='Nama pengguna atau kata sandi salah.';wig()}}
$('btnLogin').onclick=doLogin;$('pw').onkeydown=e=>{if(e.key==='Enter')doLogin()};
$('btnOut').onclick=()=>{me=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');drawPick()};

const vis=o=>filter==='all'||o.owner===filter||o.owner==='Bersama'||(filter==='mine'&&o.owner===me);
const today=()=>(new Date().getDay()+6)%7;
const tm=s=>s.start?s.start+(s.end?' – '+s.end:' – selesai'):'Fleksibel';
function nextS(l){const n=new Date();let b=null;l.forEach(s=>{for(let a=0;a<60;a++){const d=new Date(n);d.setDate(n.getDate()+a);if(!occ(s,d))continue;const[h,m]=(s.start||'00:00').split(':').map(Number);d.setHours(h,m,0,0);if(d>=n){if(!b||d<b.d)b={s,d};break}}});return b}
const left=d=>{const m=Math.floor((d-new Date())/6e4),dd=Math.floor(m/1440),h=Math.floor(m%1440/60);return(dd?dd+' hari ':'')+(h?h+' jam ':'')+m%60+' menit lagi'};
const myLogs=()=>S.logs.filter(l=>l.owner===me);
function streak(){const ds=new Set(myLogs().map(l=>l.date));let n=0,d=new Date();if(!ds.has(iso(d)))d.setDate(d.getDate()-1);while(ds.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function week(){const o=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=iso(d);o.push({l:['Min','Sen','Sel','Rab','Kam','Jum','Sab'][d.getDay()],v:myLogs().filter(x=>x.date===k).reduce((a,x)=>a+x.min,0)})}return o}
const copts=sel=>`<option value="">— umum —</option>`+S.courses.map(c=>`<option ${c.short===sel?'selected':''}>${esc(c.short)}</option>`).join('');
const filt=()=>`<div class="flex gap-2 mb-5 overflow-x-auto">${[['mine','Punyaku'],['TATA','TATA'],['YERE','YERE'],['all','Semua']].map(([v,l])=>`<button data-a="flt" data-v="${v}" class="pill ${filter===v?'on':''}">${l}</button>`).join('')}</div>`;
const sc=(s,act)=>`<div class="s"><div class="flex justify-between gap-2"><p class="font-bold">${esc(s.title)}</p><span class="t">${esc(s.owner)}</span></div><p class="ac text-sm font-semibold">${tm(s)}${s.date?' · sekali '+s.date.slice(8)+'/'+s.date.slice(5,7):''}</p>${s.info?`<p class="m text-xs mt-1">${esc(s.info)}</p>`:''}${act?`<div class="flex gap-3 mt-2 text-xs font-semibold"><button class="ac" data-a="editS" data-v="${s.id}">Ubah</button><button class="text-red-500" data-a="delS" data-v="${s.id}">Hapus</button></div>`:''}</div>`;
const head=(t,btn)=>`<div class="flex items-center justify-between mb-4"><h2 class="text-xl font-extrabold">${t}</h2>${btn||''}</div>`;

function home(){
  const p=P(),ss=S.sessions.filter(vis),cs=S.courses.filter(vis),nx=nextS(ss),td=ss.filter(s=>occ(s,new Date())).sort((a,b)=>a.start.localeCompare(b.start));
  const tk=S.tasks.filter(t=>t.owner===me&&!t.done),open=cs.reduce((a,c)=>a+c.notes.filter(n=>!n.done&&n.kind!=='topik').length,0),mins=week().reduce((a,x)=>a+x.v,0);
  const h=new Date().getHours(),hi=h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';
  return filt()+`<div class="hero p-6 sm:p-9 relative overflow-hidden"><div class="flex items-center gap-4"><div class="w-16 h-16 rounded-2xl grid place-items-center text-4xl" style="background:rgba(255,255,255,.18)">${esc(p.emoji)}</div><div><p class="text-sm opacity-80">${hi}</p><h2 class="text-2xl sm:text-3xl font-extrabold">${esc(p.name)}</h2><p class="text-sm opacity-80">${esc(p.bio||'Yuk lanjut belajar hari ini.')}</p></div></div>
  ${p.goal?`<p class="mt-4 text-sm"><span class="opacity-70">Target:</span> <b>${esc(p.goal)}</b></p>`:''}
  ${nx?`<div class="mt-5 inline-block rounded-2xl px-4 py-3" style="background:rgba(255,255,255,.14)"><p class="text-xs opacity-75">Sesi berikutnya</p><p class="font-bold text-lg">${esc(nx.s.title)} · ${DAYS[nx.s.day]} ${esc(nx.s.start)}</p><p class="text-sm opacity-85">${left(nx.d)}</p></div>`:''}</div>
  ${exB()}<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-5">${[['🔥',streak(),'Hari beruntun'],['⏳',mins,'Menit minggu ini'],['✅',tk.length,'Tugas aktif'],['❓',open,'Belum paham']].map(([i,v,l])=>`<div class="c p-4"><p class="text-xl">${i}</p><p class="text-2xl font-extrabold">${v}</p><p class="m text-xs">${l}</p></div>`).join('')}</div>
